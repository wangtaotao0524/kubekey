name: BuildContainerImage

on:
  push:
    tags:
      - 'v3*'
  workflow_dispatch:
      inputs:
        tag_name:
          description: '要构建的 Git Tag 名称 (例如: v3.1.0)'
          required: true
          default: 'v3.0.0'
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      # 1. 设置环境变量
      - name: Set env
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV # 优化了提取标签的方式

      # 2. 检出代码
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. 设置 QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 4. 设置 Docker buildx
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      # 5. 构建 Docker 镜像并打包成 OCI 格式的 tar 文件 (已修复多平台导出错误)
      - name: Build and save docker image to OCI tar
        run: |
          IMAGE_NAME="your-image-name" # <<== 替换为您的实际镜像名称
          TAG="${IMAGE_NAME}:${{ env.RELEASE_TAG }}"
          OUTPUT_PATH="/tmp/image-${{ env.RELEASE_TAG }}.tar"
          
          echo "构建镜像: ${TAG}"
          
          # 使用 buildx 构建多平台镜像并输出为 OCI 格式的 tar 包
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --tag $TAG \
            --output type=oci,dest=${OUTPUT_PATH} # <-- 关键更改：使用 type=oci
      
      # 7. 上传 .tar 文件作为工作流产物
      - name: Upload docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ env.RELEASE_TAG }}
          path: /tmp/image.tar
          retention-days: 7 # 可选：设置产物保留天数
          
      # 8. (可选) 创建 GitHub Release 并附上 tar 包
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            Docker image tarball for release ${{ env.RELEASE_TAG }}.
            
            Download the artifact: `docker-image-${{ env.RELEASE_TAG }}`
          draft: false
          prerelease: false
          files: /tmp/image.tar # 将 tar 包作为附件上传到 Release
